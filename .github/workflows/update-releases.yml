name: Actualizar releases

on:
  schedule:
    - cron: '0 10 * * *'   # Todos los días a las 10:00 UTC (6 AM en invierno, 7 AM en verano hora Chile)
  workflow_dispatch:      # Permite ejecución manual

jobs:
  update-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Obtener releases desde la API
        run: |
          curl -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/releases?per_page=5 \
               > releases_raw.json

      - name: Procesar y filtrar datos
        run: |
          jq '[.[] | {tag: .tag_name, fecha: .published_at, descripcion: .body}]' releases_raw.json > docs/releases.json

      - name: Commit y push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases.json
          git commit -m "Actualización automática de releases $(date +'%Y-%m-%d')" || echo "No hay cambios"
          git push