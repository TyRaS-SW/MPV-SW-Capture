name: Actualizar shaders y bezels

on:
  schedule:
    - cron: '0 10 * * *'   # Todos los días a las 10:00 UTC (6 AM en invierno, 7 AM en verano hora Chile)
  workflow_dispatch:

jobs:
  update-shaders:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Obtener lista de shaders
        run: |
          curl -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/contents/shaders \
               | jq '[.[] | select(.name | endswith(".glsl")) | .name]' > docs/shaders.json

      - name: Obtener lista de bezels
        run: |
          curl -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/contents/bezels \
               | jq '[.[] | select(.name | endswith(".png")) | .name]' > docs/bezels.json

      - name: Commit y push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/shaders.json docs/bezels.json
          git commit -m "Actualización automática de shaders y bezels $(date +'%Y-%m-%d')" || echo "No hay cambios"
          git push