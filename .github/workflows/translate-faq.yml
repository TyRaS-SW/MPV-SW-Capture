name: Translate FAQ to Spanish

on:
  push:
    branches: [ "main" ]        # Cambia si tu rama principal tiene otro nombre
    paths:
      - "FAQ.md"               # Se activa cuando cambias este archivo
  workflow_dispatch:           # Permite ejecutarlo manualmente

permissions:
  contents: write              # Para hacer commit del archivo traducido
  models: read                 # Necesario para usar GitHub Models

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Translate FAQ to Spanish
        uses: KevinRohn/gh-action-markdown-translate-ai@v1
        with:
          source-file: "FAQ.md"
          target-language: "Spanish"
          target-file: "FAQ.es.md"
          # Puedes elegir el modelo; por defecto usa gpt-4o-mini
          model: "gpt-4o-mini"
          # Instrucciones adicionales para mejorar la traducción
          custom-instructions: |
            Keep technical terms like 'OBS', 'plugin', 'stream', 'GitHub', 'API' in English.
            Do not translate code blocks, URLs, or Markdown syntax.
            Preserve all headings and formatting.

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FAQ.es.md
          git diff --staged --quiet || git commit -m "Auto-translate FAQ to Spanish"
          git push