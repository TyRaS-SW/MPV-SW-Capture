name: Translate FAQ to Spanish

on:
  push:
    branches: [ "main" ]
    paths:
      - "FAQ.md"
  workflow_dispatch:

permissions:
  contents: write
  models: read          # Permiso necesario
  id-token: write       # Opcional, por si se necesita

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Test GitHub Models availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Probando conexión a GitHub Models..."
          curl -X POST https://models.inference.ai.azure.com/chat/completions?api-version=2024-05-01-preview \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Hello"}]}' \
            -w "\nHTTP Status: %{http_code}\n" \
            -o /tmp/test_response.txt || echo "Curl falló"
          cat /tmp/test_response.txt

      - name: Translate FAQ to Spanish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/translate_faq.py FAQ.md FAQ.es.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FAQ.es.md
          git diff --staged --quiet || git commit -m "Auto-translate FAQ to Spanish"
          git push