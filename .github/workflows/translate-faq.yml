name: Translate FAQ to Spanish

on:
  push:
    branches: [ "main" ]
    paths:
      - "FAQ.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install deepl

      - name: Translate FAQ to Spanish
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python .github/scripts/translate_deepl.py FAQ.md FAQ.es.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FAQ.es.md
          git diff --staged --quiet || git commit -m "FAQ updated"
          git push