name: Translate FAQ to Spanish

on:
  push:
    branches: [ "main" ]
    paths:
      - "FAQ.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install deep-translator
          # También instalar requests si no está (deep-translator lo usa internamente)
          pip install requests

      - name: Translate FAQ to Spanish
        run: python .github/scripts/translate_libretranslate.py FAQ.md FAQ.es.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FAQ.es.md
          git diff --staged --quiet || git commit -m "Auto-translate FAQ to Spanish"
          git push