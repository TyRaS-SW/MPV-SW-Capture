name: Translate FAQ to Spanish

on:
  push:
    branches: [ "main" ]
    paths:
      - "FAQ.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Translate FAQ to Spanish
        uses: francois/translate-action@v1
        with:
          source_file: 'FAQ.md'
          target_file: 'FAQ.es.md'
          source_lang: 'en'
          target_lang: 'es'
          provider: 'libretranslate'
          libretranslate_url: 'https://translate.argosopentech.com'

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FAQ.es.md
          git diff --staged --quiet || git commit -m "Auto-translate FAQ to Spanish"
          git push