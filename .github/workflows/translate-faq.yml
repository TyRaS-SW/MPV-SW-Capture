name: Translate FAQ to Spanish

on:
  push:
    branches: [ "main" ]
    paths:
      - "FAQ.md"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show current directory and files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in root:"
          ls -la

      - name: Translate FAQ to Spanish
        id: translate
        uses: KevinRohn/gh-action-markdown-translate-ai@v1
        with:
          # Parámetros actualizados según la documentación de la acción
          api_key: ${{ secrets.GITHUB_TOKEN }}  # Usamos el token de GitHub para autenticación
          service_provider: "github"            # Usamos GitHub Models (gratuito)
          model: "gpt-4o-mini"                  # Modelo recomendado
          source_language: "en"                 # Idioma origen (opcional, puede auto-detectar)
          target_language: "es"                 # Idioma destino (español)
          file_path: "FAQ.md"                   # Archivo de origen
          output_file_path: "FAQ.es.md"         # Archivo de salida
          # update_mode: "replace"              # Opcional: replace, merge, etc.

      - name: Check if translation file was created
        run: |
          echo "Checking if FAQ.es.md exists..."
          if [ -f "FAQ.es.md" ]; then
            echo "✅ FAQ.es.md exists"
            echo "First 10 lines:"
            head -n 10 FAQ.es.md
          else
            echo "❌ FAQ.es.md does NOT exist"
            echo "Creating a dummy file to force commit"
            echo "# FAQ en español (traducción automática)" > FAQ.es.md
            echo "La traducción automática falló. Revisar logs." >> FAQ.es.md
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FAQ.es.md
          git diff --staged --quiet || git commit -m "Auto-translate FAQ to Spanish"
          git push