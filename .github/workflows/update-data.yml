name: Actualizar datos (releases, shaders, bezels)

on:
  schedule:
    - cron: '0 10 * * *'   # Todos los días a las 10:00 UTC
  workflow_dispatch:      # Ejecución manual desde la interfaz de GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Obtener releases (últimos 5)
        run: |
          curl -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/releases?per_page=5 \
               | jq '[.[] | {tag: .tag_name, fecha: .published_at, descripcion: .body}]' > docs/releases.json

      - name: Obtener shaders (archivos .glsl)
        run: |
          if [ -d "shaders" ]; then
            curl -H "Accept: application/vnd.github.v3+json" \
                 https://api.github.com/repos/${{ github.repository }}/contents/shaders \
                 | jq '[.[] | select(.name | endswith(".glsl")) | .name]' > docs/shaders.json
          else
            echo '[]' > docs/shaders.json
          fi

      - name: Obtener bezels (archivos .png)
        run: |
          if [ -d "bezels" ]; then
            curl -H "Accept: application/vnd.github.v3+json" \
                 https://api.github.com/repos/${{ github.repository }}/contents/bezels \
                 | jq '[.[] | select(.name | endswith(".png")) | .name]' > docs/bezels.json
          else
            echo '[]' > docs/bezels.json
          fi

      - name: Validar JSON generado
        run: |
          for file in docs/releases.json docs/shaders.json docs/bezels.json; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ Error: $file no es un JSON válido"
              exit 1
            fi
          done
          echo "✅ Todos los JSON son válidos."

      - name: Commit y push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases.json docs/shaders.json docs/bezels.json
          git commit -m "Actualización automática de datos $(date +'%Y-%m-%d %H:%M')" || echo "ℹ️ No hay cambios para commit"
          git push